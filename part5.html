<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بأسمائه نحيا — الجزء 5</title>
  <meta name="description" content="قارئ كتاب بأسمائه نحيا — فقه الحب والتقوى في الأسماء الحسنى">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* Uthmanic font for Quran verses */
    @font-face {
      font-family: "Uthmanic";
      src: url("assets/uthmanic-hafs.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --bg:      #f8f4ef;
      --surface: #ffffff;
      --text:    #1c1007;
      --muted:   #6b5d4f;
      --accent:  #8b3a12;
      --accent2: #d4a574;
      --border:  #e8dfd6;
      --shadow:  0 6px 22px rgba(0,0,0,.07);
      --radius:  14px;
      --font:    Georgia,"Times New Roman",serif;
      --font-ui: system-ui,sans-serif;
      --size:    18px;
      --lh:      2;
      --panel-w: 300px;
    }
    body.dark  { --bg:#111317; --surface:#1a1f27; --text:#f0e5d8; --muted:#baa58f; --accent:#e2a05f; --accent2:#be7f40; --border:#2d3440; --shadow:0 8px 28px rgba(0,0,0,.38); }
    body.sepia { --bg:#f0e7d8; --surface:#fbf4e6; --text:#3d2a18; --muted:#6d553f; --accent:#915c2e; --accent2:#bb8a58; --border:#dfd0bc; }
    body.sand  { --bg:#ede2bd; --surface:#fbf6df; --text:#332b1f; --muted:#6f5e45; --accent:#8a6d42; --accent2:#af8f60; --border:#d8c49a; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--size);
      line-height: var(--lh);
      overflow-x: hidden;
      transition: background .2s, color .2s;
    }

    /* ── PROGRESS BAR ─────────────────────────────────────────────────── */
    #prog-track {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px; z-index: 600; pointer-events: none;
    }
    #prog-fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width .1s linear;
    }

    /* ── TOPBAR — sticky, auto-hides on scroll-down ───────────────────── */
    #topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      gap: .6rem; flex-wrap: wrap;
      padding: .7rem 1.2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: transform .26s ease, background .2s, border-color .2s;
    }
    #topbar.hidden { transform: translateY(calc(-100% - 3px)); }

    .brand { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-title { color: var(--accent); font-size: 1.18rem; font-weight: 700; }
    .brand-sub   { color: var(--muted); font-family: var(--font-ui); font-size: .73rem; }

    .ctrl-row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .46rem .82rem; min-height: 42px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text);
      font-family: var(--font-ui); font-size: .86rem;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: border-color .18s, box-shadow .18s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-color: transparent; color: #fff;
    }
    .btn.primary:hover { opacity: .91; }

    /* ── READING AREA ─────────────────────────────────────────────────── */
    #wrap { max-width: 900px; margin: 0 auto; padding: 1.4rem 1rem 4rem; }

    #content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      min-height: 60vh;
      transition: background .2s, border-color .2s;
    }

    /* ── WORD/MSO NORMALISATION ───────────────────────────────────────── */
    #content section + section {
      border-top: 1px solid var(--border);
      padding-top: 2rem; margin-top: 2rem;
    }
    #content p,
    #content div,
    #content h1,#content h2,#content h3,
    #content h4,#content h5,#content h6,
    #content ul,#content ol {
      width: auto     !important;
      max-width: 100% !important;
      margin-left: 0  !important;
      margin-right: 0 !important;
    }
    #content p {
      line-height: var(--lh) !important;
      margin-bottom: 1rem;
      text-align: justify;
      text-indent: 0 !important;
      overflow-wrap: anywhere;
    }
    #content h1 { color: var(--accent); font-size: 1.55rem; margin: 1.3rem 0 .75rem; }
    #content h2 { color: var(--accent); font-size: 1.22rem; margin: 1.1rem 0 .6rem; }
    #content h3 { color: var(--accent); font-size: 1.05rem; margin: .9rem 0 .5rem; }
    #content ul,#content ol { list-style-position: inside !important; padding-right: 1rem !important; margin-bottom: 1rem; }
    #content li { margin-bottom: .35rem; text-indent: 0 !important; overflow-wrap: anywhere; }
    #content blockquote { border-right: 3px solid var(--accent2); padding-right: 1rem; margin: 1rem 0; color: var(--muted); }
    #content .MsoToc1,#content .MsoToc2 { width: auto !important; max-width: 100% !important; padding-right: .75rem !important; text-indent: 0 !important; white-space: normal !important; overflow-wrap: anywhere !important; tab-size: 0 !important; }
    #content img    { max-width: 100% !important; height: auto !important; }
    /* Tables: keep display:table so cell backgrounds/colours render correctly.
       Horizontal scrolling is handled by .tbl-wrap added by fixLayout(). */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
    #content table  { max-width: 100% !important; border-collapse: collapse; }
    #content .quran-quote,
    #content .quran-quote * { font-family: "Uthmanic","Noto Naskh Arabic",Georgia,serif !important; letter-spacing: 0 !important; word-spacing: .04em; }

    /* ── STATUS / LOADER ──────────────────────────────────────────────── */
    .msg { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .msg h2 { color: var(--accent); margin-bottom: .6rem; }
    .msg p  { font-family: var(--font-ui); font-size: .92rem; }

    #load-bar-wrap {
      display: none;
      margin-bottom: 1rem;
      font-family: var(--font-ui); font-size: .82rem;
      color: var(--muted);
    }
    #load-bar-wrap.show { display: block; }
    #load-bar-bg {
      height: 4px; background: var(--border); border-radius: 2px;
      overflow: hidden; margin-top: .4rem;
    }
    #load-bar-fill {
      height: 100%; width: 0; background: var(--accent2); border-radius: 2px;
      transition: width .18s ease;
    }
    #load-spinner { text-align: center; padding: 1rem; font-family: var(--font-ui); font-size: .82rem; color: var(--muted); }

    /* ── PANELS ───────────────────────────────────────────────────────── */
    .panel {
      position: fixed; top: 0; height: 100vh; height: 100dvh;
      width: var(--panel-w); overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow); z-index: 200; padding: 1rem;
      transition: transform .24s ease, background .2s, border-color .2s;
    }
    #names-panel    { right: 0; transform: translateX(110%); }
    #settings-panel { left: 0;  transform: translateX(-110%); }
    #feedback-panel { right: 0; transform: translateX(110%); }
    #feedback-panel.open { transform: translateX(0); }
    .panel.open     { transform: translateX(0); }

    .panel h3 { color: var(--accent); font-size: 1.05rem; margin-bottom: .9rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }

    .panel-close { float: left; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); padding: .6rem .8rem; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
    #settings-panel .panel-close { float: right; }

    /* Names list inside panel — flat, no categories */
    .name-btn {
      display: block; width: 100%; text-align: right;
      padding: .55rem .75rem; margin-bottom: .3rem;
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: var(--font); font-size: .96rem;
      cursor: pointer; min-height: 42px; touch-action: manipulation;
      transition: background .14s, border-color .14s, color .14s;
    }
    .name-btn:hover, .name-btn.active {
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      border-color: var(--accent2); color: var(--accent);
    }
    .name-btn small { display: block; font-family: var(--font-ui); font-size: .68rem; color: var(--muted); margin-top: .1rem; }

    /* ── SETTINGS ─────────────────────────────────────────────────────── */
    .s-row { margin-bottom: 1.1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .s-row:last-child { border-bottom: none; }
    .s-label { display: block; font-family: var(--font-ui); font-size: .84rem; color: var(--muted); margin-bottom: .42rem; }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
    .th-btn { padding: .5rem .3rem; border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-family: var(--font-ui); font-size: .82rem; text-align: center; min-height: 40px; touch-action: manipulation; transition: border-color .15s, transform .15s; }
    .th-btn.active { border-color: var(--accent); transform: translateY(-1px); }
    .th-btn[data-t="light"] { background:#f8f4ef; color:#1c1007; }
    .th-btn[data-t="dark"]  { background:#1a1f27; color:#f0e5d8; }
    .th-btn[data-t="sepia"] { background:#f0e7d8; color:#3d2a18; }
    .th-btn[data-t="sand"]  { background:#ede2bd; color:#332b1f; }
    select { width: 100%; padding: .48rem .6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-family: var(--font-ui); font-size: .9rem; }
    .num-row { display: flex; align-items: center; gap: .5rem; }
    .num-val  { min-width: 48px; text-align: center; font-family: var(--font-ui); color: var(--muted); font-size: .84rem; }
    .num-btn  { flex-shrink: 0; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    input[type="range"] { width: 100%; }

    /* ── OVERLAY ──────────────────────────────────────────────────────── */
    #overlay { position: fixed; inset: 0; z-index: 190; background: rgba(0,0,0,.26); opacity: 0; pointer-events: none; transition: opacity .24s; }
    #overlay.show { opacity: 1; pointer-events: auto; }

    /* ── AUTOSAVE TOAST ───────────────────────────────────────────────── */
    #save-ind { position: fixed; bottom: 1rem; left: 1rem; z-index: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .38rem .75rem; font-family: var(--font-ui); font-size: .73rem; color: var(--muted); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
    #save-ind.show { opacity: 1; transform: translateY(0); }

    /* ── RESPONSIVE ───────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #topbar { flex-direction: column; align-items: stretch; }
      .ctrl-row { justify-content: center; }
      #wrap { padding: .75rem .5rem 2.5rem; }
      #content { padding: 1rem; border-radius: 10px; }
      .panel { width: min(var(--panel-w), 90vw); }
      .btn { flex: 1 1 auto; }
    }
    @media (max-width: 480px) {
      .brand-title { font-size: 1.05rem; }
      #content { padding: .85rem; }
      .btn { font-size: .82rem; padding: .44rem .6rem; }
    }
  </style>
</head>

<body>
  <div id="prog-track" aria-hidden="true"><div id="prog-fill"></div></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-title">بأسمائه نحيا</span>
      <span class="brand-sub" id="part-badge">جارٍ التحميل…</span>
    </div>
    <nav class="ctrl-row" aria-label="أدوات القارئ">
      <a href="index.html" class="btn">🏠 الرئيسية</a>
      <button class="btn" id="btn-feedback" type="button">💬 ملاحظات</button>
      <button class="btn primary" id="btn-continue" type="button">استمرار</button>
    </nav>
  </header>

  <!-- Feedback panel -->
  <aside id="feedback-panel" class="panel" aria-label="إرسال ملاحظة">
    <button class="panel-close" id="close-feedback" type="button" aria-label="إغلاق">✕</button>
    <h3>💬 أرسل ملاحظة</h3>
    <form id="feedback-form" novalidate>
      <div class="s-row">
        <label class="s-label" for="fb-name">الاسم (اختياري)</label>
        <input type="text" id="fb-name" name="name" placeholder="اسمك…"
               style="width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:8px;
                      background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:.9rem;">
      </div>
      <div class="s-row">
        <label class="s-label" for="fb-msg">الملاحظة <span style="color:var(--accent)">*</span></label>
        <textarea id="fb-msg" name="message" rows="5" required
                  placeholder="اكتب ملاحظتك هنا…"
                  style="width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:8px;
                         background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:.9rem;
                         resize:vertical;"></textarea>
      </div>
      <div id="fb-status" style="font-family:var(--font-ui);font-size:.84rem;margin-bottom:.6rem;min-height:1.2em;"></div>
      <button type="submit" class="btn primary" style="width:100%;justify-content:center;">
        إرسال الملاحظة ✉
      </button>
    </form>
  </aside>

  <div id="overlay" aria-hidden="true"></div>

  <main id="wrap">
    <!-- Loading bar shown during multi-chunk load -->
    <div id="load-bar-wrap" aria-live="polite">
      <span id="load-bar-txt">جارٍ التحميل…</span>
      <div id="load-bar-bg"><div id="load-bar-fill"></div></div>
    </div>
    <div id="content">
      <div class="msg"><h2>جارٍ التحميل…</h2><p>يُرجى الانتظار</p></div>
    </div>
    <div id="load-spinner"></div>
  </main>

  <!-- Self-contained content for part 5 -->
  <template id="inline-part-data" data-part-id="5"></template>

  <div id="save-ind" role="status" aria-live="polite">تم حفظ موضع القراءة ✓</div>

      { ar:'الْقَرِيبُ الْمُجِيبُ الشَّافِي',                 chunk:5  },
      { ar:'ٱلْغَالِبُ ٱلنَّصِيرُ',                          chunk:8  },
      { ar:'ٱلْوَكِيلُ ٱلْحَيُّ ٱلْقَيُّومُ',               chunk:13 },
      { ar:'السَّلَام',                                       chunk:17 },
      { ar:'الغَنِيّ',                                        chunk:20 },
      { ar:'ٱلْوَلِيُّ ٱلْمَوْلَى',                          chunk:23 },
      { ar:'الهَادِي',                                        chunk:28 },
      { ar:'ٱلْمُهَيْمِنُ ٱلْوَاسِعُ ٱلْمُحِيطُ',           chunk:32 },
    ]
  }
];

/* ══════════════════════════════════════════════════════════
   STORAGE
══════════════════════════════════════════════════════════ */
const SK     = 'asma_v3_';
const GLOB_K = SK + 'global';

function stor(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
function read(k, d=null) { try { const r=localStorage.getItem(k); return r?JSON.parse(r):d; } catch(_){ return d; } }

function saveGlobal() {
  if (!S.part) return;
  let scrollOffset = 0;
  if (S.currentNameAr) {
    const el = findNameHeading(S.currentNameAr);
    if (el) {
      const nameTop = el.getBoundingClientRect().top + window.scrollY - 90;
      scrollOffset = Math.max(0, window.scrollY - nameTop);
    }
  }
  const rec = {
    partId:   S.part.id,
    chunkNum: S.currentChunk,
    nameAr:   S.currentNameAr,
    scrollOffset,
    ts:       Date.now()
  };
  stor(GLOB_K, rec);
  stor(SK + 'part' + S.part.id, rec);
}

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
const S = {
  part: null,
  nextChunk: 1,
  currentChunk: 1,
  currentNameAr: '',
  loadingNext: false,
  lastY: 0, scrollDir: 0,
  saveTimer: null,
  restoreScrollOffset: 0,
  restoreTargetY: -1,
};

/* ══════════════════════════════════════════════════════════
   DOM REFS
══════════════════════════════════════════════════════════ */
const g = id => document.getElementById(id);
const D = {
  topbar:    g('topbar'),
  badge:     g('part-badge'),
  content:   g('content'),
  spinner:   g('load-spinner'),
  prog:      g('prog-fill'),
  lbWrap:    g('load-bar-wrap'),
  lbTxt:     g('load-bar-txt'),
  lbFill:    g('load-bar-fill'),
  feedbackP: g('feedback-panel'),
  overlay:   g('overlay'),
  saveInd:   g('save-ind'),
  btnFB:     g('btn-feedback'),
  btnC:      g('btn-continue'),
};

/* ══════════════════════════════════════════════════════════
   FEEDBACK PANEL
══════════════════════════════════════════════════════════ */
let openP = null;
function showPanel(p) {
  if (openP) openP.classList.remove('open');
  openP = p; p.classList.add('open');
  D.overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function hidePanel() {
  if (openP) { openP.classList.remove('open'); openP = null; }
  D.overlay.classList.remove('show');
  document.body.style.overflow = '';
}

function initFeedback() {
  const form   = document.getElementById('feedback-form');
  const status = document.getElementById('fb-status');
  if (!form) return;

  /* Destination assembled in JS at runtime — not visible as plain text */
  const _e = ['m','a','f','.','b','d','c','@','g','m','a','i','l','.','c','o','m'].join('');
  const _ep = btoa(_e);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = (document.getElementById('fb-name').value || '').trim();
    const msg  = document.getElementById('fb-msg').value.trim();
    if (!msg) {
      status.style.color = 'var(--accent)';
      status.textContent = 'يُرجى كتابة ملاحظتك أولاً.';
      return;
    }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    status.style.color = 'var(--muted)';
    status.textContent = 'جارٍ الإرسال…';
    try {
      const payload = {
        _subject: 'ملاحظة — بأسمائه نحيا',
        name: name || 'زائر',
        message: msg,
        _captcha: 'false',
        _template: 'table'
      };
      const res = await fetch('https://formsubmit.co/ajax/' + atob(_ep), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.success !== false) {
        status.style.color = '#2e7d32';
        status.innerHTML =
          'شكراً! وصلت ملاحظتك بنجاح ✓<br>' +
          '<small style="color:var(--muted);font-size:.78rem">' +
          'إذا كانت هذه أول مرة ترسل فيها ملاحظة، ابحث في صندوق بريدك عن رسالة تفعيل ' +
          'من FormSubmit واضغط الرابط بداخلها.</small>';
        form.reset();
      } else {
        throw new Error('fail');
      }
    } catch(_) {
      status.style.color = 'var(--accent)';
      const _fbEmail = atob(_ep);
      status.innerHTML =
        'حدث خطأ في الإرسال. ' +
        '<a href="mailto:' + _fbEmail + '?subject=' + encodeURIComponent('ملاحظة — بأسمائه نحيا') +
        '&body=' + encodeURIComponent((document.getElementById('fb-msg').value||'')) + '" ' +
        'style="color:var(--accent)">أرسل بريداً مباشراً</a> بدلاً من ذلك.';
    } finally {
      btn.disabled = false;
    }
  });
}

/* ══════════════════════════════════════════════════════════
   CHUNK FETCHER  (cache-first, ~185 KB per chunk)
══════════════════════════════════════════════════════════ */
const chunkCache = {};

async function fetchChunk(part, num) {
  const key = `${part.id}-${num}`;
  if (chunkCache[key] !== undefined) return chunkCache[key];
  const url = `${part.base}/chunk-${String(num).padStart(3,'0')}.html`;
  try {
    const r = await fetch(url, { cache: 'force-cache' });
    if (!r.ok) { chunkCache[key] = null; return null; }
    const html = await r.text();
    chunkCache[key] = html;
    return html;
  } catch(_) { chunkCache[key] = null; return null; }
}

/* Silently prefetch a chunk into cache */
function prefetchChunk(part, num) {
  if (num < 1 || num > part.count) return;
  const key = `${part.id}-${num}`;
  if (chunkCache[key] !== undefined) return;
  fetch(`${part.base}/chunk-${String(num).padStart(3,'0')}.html`, { cache: 'force-cache', priority:'low' })
    .catch(() => {});
}

/* Prefetch adjacent parts' first chunks for instant switching */
const warmedParts = new Set();
function prefetchAdjacent(currentId) {
  [currentId - 1, currentId + 1].forEach(id => {
    if (warmedParts.has(id)) return;
    const part = PARTS.find(p => p.id === id);
    if (!part) return;
    warmedParts.add(id);
    const run = () => {
      fetch(`part${id}.html`, { cache:'force-cache', priority:'low' }).catch(()=>{});
      prefetchChunk(part, 1);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout:3000 });
    else setTimeout(run, 1000);
  });
}

/* ══════════════════════════════════════════════════════════
   LAYOUT FIXERS
══════════════════════════════════════════════════════════ */
function fixImages(root) {
  root.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (src.includes('.fld/') || src.includes('%20') || src.startsWith('file:'))
      img.style.display = 'none';
  });
}

function fixLayout() {
  const c = D.content;

  /* 1. Convert absolute-positioned Word artifacts to relative */
  c.querySelectorAll('[style*="position:absolute"],[style*="position: absolute"]').forEach(el => {
    el.style.position = 'relative';
    el.style.left = '';
    el.style.top  = '';
    el.style.zIndex = '';        /* clear massive Word z-index values */
    el.style.marginTop = '';
    el.style.marginLeft = '';
  });

  /* 2. Zero out any remaining huge z-index values (z > 100 is a Word artifact).
        These create invisible overlays that block clicks on the topbar/buttons. */
  c.querySelectorAll('[style*="z-index"]').forEach(el => {
    const zi = parseInt(el.style.zIndex, 10);
    if (!isNaN(zi) && zi > 100) el.style.zIndex = '';
  });

  /* 3. Fix white-text-on-white-background from Word tables */
  c.querySelectorAll('[style]').forEach(el => {
    const s = el.style;
    const col = s.color;
    if (col && (col === 'white' || col === '#ffffff' || col === 'rgb(255, 255, 255)')) {
      const bg = s.backgroundColor;
      const hasDarkBg = bg && bg !== '' && bg !== 'transparent' &&
                        bg !== 'rgba(0, 0, 0, 0)' && bg !== 'white' &&
                        bg !== '#ffffff' && bg !== 'rgb(255, 255, 255)';
      if (!hasDarkBg) s.color = '';
    }
  });

  /* 4. Wrap tables for horizontal scroll */
  c.querySelectorAll('table').forEach(tbl => {
    if (tbl.parentElement && tbl.parentElement.classList.contains('tbl-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });
}

/* ══════════════════════════════════════════════════════════
   NAME HEADING FINDER
══════════════════════════════════════════════════════════ */
function normalize(s) {
  return s
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/[\u0671أإآا]/g, 'ا')
    .replace(/[()（）\[\]]/g, '')
    .replace(/\s+/g, '');
}

function findNameHeading(nameAr) {
  const target = normalize(nameAr);
  const targetShort = target.slice(0, 6);
  for (const el of D.content.querySelectorAll('h1,h2,h3,h4')) {
    const txt = normalize(el.textContent || '');
    if (txt.includes(target) || (targetShort.length > 3 && txt.includes(targetShort))) return el;
  }
  for (const el of D.content.querySelectorAll('p')) {
    const txt = normalize(el.textContent || '');
    if (target.length > 4 && txt === target) return el;
  }
  return null;
}

/* Detect which name the reader is currently on, based on scroll */
function detectCurrentName() {
  if (!S.part) return;
  const mid = window.scrollY + window.innerHeight * 0.3;
  let best = S.part.names[0];
  for (const n of S.part.names) {
    const el = findNameHeading(n.ar);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY;
      if (top <= mid) { best = n; }
    }
  }
  if (best) {
    S.currentChunk  = best.chunk;
    S.currentNameAr = best.ar;
  }
}

/* ══════════════════════════════════════════════════════════
   PROGRESS & UI HELPERS
══════════════════════════════════════════════════════════ */
function updateProg() {
  const total = document.documentElement.scrollHeight - window.innerHeight;
  D.prog.style.width = (total > 0 ? Math.min(100, window.scrollY / total * 100) : 0).toFixed(1) + '%';
}
function updateBadge() {
  if (!S.part) return;
  D.badge.textContent = `${S.part.title} — الجزء ${S.part.id} من 7`;
}
function flashSave() {
  D.saveInd.classList.add('show');
  clearTimeout(D.saveInd._t);
  D.saveInd._t = setTimeout(() => D.saveInd.classList.remove('show'), 2000);
}
function scheduleSave() {
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(() => {
    detectCurrentName();
    saveGlobal();
    flashSave();
  }, 2500);
}
function showLoadBar(cur, tot) {
  D.lbWrap.classList.add('show');
  D.lbTxt.textContent = `جارٍ التحميل…`;
  D.lbFill.style.width = (tot > 0 ? Math.round(cur / tot * 100) : 0) + '%';
}
function hideLoadBar() {
  D.lbWrap.classList.remove('show');
  D.lbFill.style.width = '0';
}

/* ══════════════════════════════════════════════════════════
   CORE: PROGRESSIVE CHUNK LOADER
   Shows the first chunk within ~200 ms, loads the rest
   silently in the background.
══════════════════════════════════════════════════════════ */
function appendChunk(wrapper, html, num) {
  const div = document.createElement('div');
  div.className = 'chunk';
  div.dataset.chunk = num;
  div.innerHTML = html;
  fixImages(div);
  wrapper.appendChild(div);
}

async function loadPart(part, startChunk, scrollToName) {
  S.part = part;
  S.nextChunk = Math.max(1, startChunk || 1);
  S.loadingNext = false;
  S.currentChunk  = S.nextChunk;
  S.currentNameAr = scrollToName || '';

  D.content.innerHTML = '';
  D.spinner.textContent = '';
  hideLoadBar();
  updateBadge();

  /* Build content wrapper */
  const wrapper = document.createElement('div');
  wrapper.className = 'chunks-wrapper';
  wrapper.setAttribute('data-part', part.id);
  D.content.appendChild(wrapper);

  /* ── Fetch & display first chunk immediately ── */
  showLoadBar(1, 2);
  const firstHtml = await fetchChunk(part, S.nextChunk);
  hideLoadBar();

  if (firstHtml === null) {
    if (location.protocol === 'file:') {
      D.content.innerHTML =
        '<div class="msg">' +
        '<h2>لا يمكن التشغيل من ملف محلي</h2>' +
        '<p>يعمل الموقع بشكل كامل بعد رفعه على GitHub Pages، ' +
        'أو شغّله محلياً بخادم بسيط:</p>' +
        '<p style="direction:ltr;text-align:left;background:#f4ebe0;padding:.7rem 1rem;border-radius:8px;font-family:monospace;font-size:.88rem;margin-top:.8rem;display:inline-block">python3 -m http.server 8000</p>' +
        '<p>ثم افتح <code>http://localhost:8000/</code></p></div>';
      return;
    }
    D.content.innerHTML =
      '<div class="msg"><h2>تعذّر تحميل المحتوى</h2>' +
      '<p>يُرجى التحقق من اتصالك بالإنترنت وإعادة تحميل الصفحة.</p></div>';
    return;
  }

  appendChunk(wrapper, firstHtml, S.nextChunk);
  S.nextChunk++;
  fixLayout();
  prefetchAdjacent(part.id);

  /* ── Scroll to name heading ── */
  if (scrollToName) {
    await new Promise(r => requestAnimationFrame(r));
    await new Promise(r => setTimeout(r, 80));
    const el = findNameHeading(scrollToName);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 90;
      const targetY = Math.max(0, y + S.restoreScrollOffset);
      S.restoreScrollOffset = 0;
      window.scrollTo({ top: targetY, behavior: 'instant' });
      /* Store target so loadRemaining can re-scroll if content was too short */
      S.restoreTargetY = targetY;
    } else {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  } else {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  updateProg();

  /* ── Load remaining chunks in background ── */
  loadRemaining(part, wrapper);
}

async function loadRemaining(part, wrapper) {
  if (S.loadingNext) return;
  S.loadingNext = true;
  while (S.nextChunk <= part.count && S.part === part) {
    const html = await fetchChunk(part, S.nextChunk);
    if (html === null) break;
    appendChunk(wrapper, html, S.nextChunk);
    S.nextChunk++;
    /* Re-apply restore target now that page is taller */
    if (S.restoreTargetY >= 0) {
      const maxY = document.documentElement.scrollHeight - window.innerHeight;
      if (S.restoreTargetY <= maxY + 10) {
        window.scrollTo({ top: S.restoreTargetY, behavior: 'instant' });
        S.restoreTargetY = -1;
      }
    }
    /* Yield to browser so scroll/input stays responsive */
    await new Promise(r => setTimeout(r, 30));
  }
  if (S.part === part) fixLayout();
  S.loadingNext = false;
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
async function goToName(partId, chunkNum, nameAr) {
  const part = PARTS.find(p => p.id === partId);
  if (!part) return;

  /* If this page is for a different part, navigate there */
  const tpl = document.getElementById('inline-part-data');
  const thisPartId = tpl ? +tpl.dataset.partId : 0;
  if (thisPartId && thisPartId !== partId) {
    location.href = `part${partId}.html?start=${chunkNum}`;
    return;
  }

  const url = new URL(location.href);
  url.searchParams.set('part',  partId);
  url.searchParams.set('start', chunkNum);
  url.searchParams.delete('restore');
  history.replaceState(null, '', url.toString());

  S.currentChunk  = chunkNum;
  S.currentNameAr = nameAr || '';
  saveGlobal();
  await loadPart(part, chunkNum, nameAr);
}

async function restoreSession(saved) {
  const part = PARTS.find(p => p.id === saved.partId);
  if (!part) return false;

  /* If this page is for a different part, navigate there */
  const tpl = document.getElementById('inline-part-data');
  const thisPartId = tpl ? +tpl.dataset.partId : 0;
  if (thisPartId && thisPartId !== saved.partId) {
    location.href = `part${saved.partId}.html?start=${saved.chunkNum || 1}`;
    return true;
  }

  S.currentChunk  = saved.chunkNum || 1;
  S.currentNameAr = saved.nameAr  || '';
  S.restoreScrollOffset = saved.scrollOffset || 0;
  await loadPart(part, saved.chunkNum || 1, saved.nameAr || null);
  return true;
}

async function continueReading() {
  const saved = read(GLOB_K);
  if (saved && saved.partId) {
    await restoreSession(saved);
  } else {
    await goToName(1, 4, 'الرَّحْمٰن');
  }
}

/* ══════════════════════════════════════════════════════════
   SCROLL HANDLER
══════════════════════════════════════════════════════════ */
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    updateProg();
    const y   = window.scrollY;
    if (S.restoreTargetY >= 0 && Math.abs(y - S.restoreTargetY) > 50) S.restoreTargetY = -1;
    const dir = y > S.lastY ? 1 : -1;
    if (dir !== S.scrollDir) {
      S.scrollDir = dir;
      D.topbar.classList.toggle('hidden', dir === 1 && y > 100);
    }
    S.lastY = y;
    scheduleSave();
  });
}

/* ══════════════════════════════════════════════════════════
   WIRE EVENTS
══════════════════════════════════════════════════════════ */
function wireEvents() {
  if (D.btnFB) D.btnFB.addEventListener('click', () => showPanel(D.feedbackP));
  D.overlay.addEventListener('click', hidePanel);
  const closeFB = g('close-feedback');
  if (closeFB) closeFB.addEventListener('click', hidePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePanel(); });

  D.btnC.addEventListener('click', continueReading);

  window.addEventListener('scroll', onScroll, { passive: true });

  const forceSave = () => {
    clearTimeout(S.saveTimer);
    detectCurrentName();
    saveGlobal();
  };
  window.addEventListener('pagehide',           forceSave);
  window.addEventListener('beforeunload',       forceSave);
  document.addEventListener('visibilitychange', () => { if (document.hidden) forceSave(); });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 820) hidePanel();
    updateProg();
  }, { passive: true });
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
async function init() {
  wireEvents();
  initFeedback();

  const p      = new URLSearchParams(location.search);
  const pParam = +p.get('part')  || 0;
  const start  = +p.get('start') || 0;

  /* Which part page is this? (data-part-id on the empty template) */
  const tpl        = document.getElementById('inline-part-data');
  const thisPartId = tpl ? +tpl.dataset.partId : 0;

  /* Direct name navigation from index.html: ?start=N (no ?part= needed) */
  const targetPart = pParam || thisPartId;
  if (targetPart && start) {
    const part      = PARTS.find(q => q.id === targetPart);
    const nameEntry = part && part.names.find(n => n.chunk === start);
    const nameAr    = nameEntry ? nameEntry.ar : null;

    /* If the user was previously reading this exact name, restore their scroll
       position within the name (not just the heading) */
    const _sv = read(SK + 'part' + targetPart) || read(GLOB_K);
    if (_sv && _sv.partId === targetPart && _sv.nameAr === nameAr && (_sv.scrollOffset || 0) > 20) {
      S.restoreScrollOffset = _sv.scrollOffset;
    }

    await goToName(targetPart, start, nameAr);
    return;
  }

  /* Part page opened directly (no start param) — restore saved position */
  if (thisPartId) {
    const saved = read(SK + 'part' + thisPartId);
    if (saved && (saved.chunkNum || saved.maxChunk)) {
      const chk = saved.chunkNum || saved.maxChunk;
      await restoreSession({ ...saved, partId: thisPartId, chunkNum: chk });
      return;
    }
    await goToName(thisPartId, 1, null);
    return;
  }

  /* No URL params, no part context — auto-restore global session */
  const glob = read(GLOB_K);
  if (glob && glob.partId) { await restoreSession(glob); return; }

  /* Very first visit */
  await goToName(1, 4, 'الرَّحْمٰن');
}

init();

/* ══════════════════════════════════════════════════════════
   SERVICE WORKER
══════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  });
}

})();
