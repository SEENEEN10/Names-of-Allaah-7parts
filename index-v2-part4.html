<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بأسمائه نحيا - الجزء الرابع</title>
  <meta name="description" content="قارئ كتاب بأسمائه نحيا - الجزء الرابع - واجهة قراءة عربية متوافقة مع GitHub Pages">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=Cairo:wght@400;600;700&amp;family=Tajawal:wght@400;500;700&amp;family=Noto+Naskh+Arabic:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Uthmanic Hafs Local";
      src: url("assets/uthmanic-hafs.otf") format("opentype");
      font-display: swap;
    }
    :root {
      --bg-primary: #f8f4ef;
      --surface: #ffffff;
      --text-primary: #1c1007;
      --text-secondary: #6b5d4f;
      --accent: #8b3a12;
      --accent-soft: #d4a574;
      --border-color: #e8dfd6;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --font-size: 18px;
      --line-height: 2;
      --font-family: "Amiri", serif;
      --panel-width: 320px;
      --header-height: 72px;
      --transition: 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: var(--font-size);
      line-height: var(--line-height);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      transition: background var(--transition), color var(--transition);
    }

    body.panel-open {
      overflow: hidden;
    }

    body.theme-dark {
      --bg-primary: #111317;
      --surface: #1a1f27;
      --text-primary: #f0e5d8;
      --text-secondary: #baa58f;
      --accent: #e2a05f;
      --accent-soft: #be7f40;
      --border-color: #2d3440;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    body.theme-sepia {
      --bg-primary: #f0e7d8;
      --surface: #fbf4e6;
      --text-primary: #3d2a18;
      --text-secondary: #6d553f;
      --accent: #915c2e;
      --accent-soft: #bb8a58;
      --border-color: #dfd0bc;
    }

    body.theme-sand {
      --bg-primary: #ede2bd;
      --surface: #fbf6df;
      --text-primary: #332b1f;
      --text-secondary: #6f5e45;
      --accent: #8a6d42;
      --accent-soft: #af8f60;
      --border-color: #d8c49a;
    }

    .progress-track {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: transparent;
      z-index: 300;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent));
      transition: width 0.12s linear;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 120;
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: calc(1rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) 1rem calc(1.25rem + env(safe-area-inset-left));
      border-bottom: 1px solid var(--border-color);
      background: color-mix(in srgb, var(--bg-primary) 88%, white 12%);
      backdrop-filter: blur(4px);
      transition: transform 0.26s ease, background var(--transition), border-color var(--transition);
    }

    .topbar.is-hidden {
      transform: translateY(calc(-100% - 4px));
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .brand-title {
      color: var(--accent);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--text-secondary);
      font-family: "Cairo", sans-serif;
      font-size: 0.8rem;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--border-color);
      background: var(--surface);
      color: var(--text-primary);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: "Cairo", sans-serif;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      min-height: 44px;
      touch-action: manipulation;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent-soft);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      border-color: transparent;
      color: #fff;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .layout {
      max-width: 980px;
      margin: 0 auto;
      padding: 2rem 1rem calc(2.5rem + env(safe-area-inset-bottom));
    }

    .content-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: var(--shadow);
      min-height: 65vh;
      overflow-x: hidden;
    }

    .content-card section {
      max-width: 100%;
    }

    .content-card h1,
    .content-card h2,
    .content-card h3 {
      color: var(--accent);
      margin: 1.2rem 0 0.8rem;
      text-wrap: balance;
    }

    .content-card p,
    .content-card li,
    .content-card blockquote {
      margin-bottom: 1rem;
      text-align: justify;
      text-wrap: pretty;
    }

    .content-card ul,
    .content-card ol {
      margin: 0 1.4rem 1.2rem 0;
    }

    /* Normalize imported Word markup so the opening pages align like the rest */
    .content-card.full-book p,
    .content-card.full-book div,
    .content-card.full-book h1,
    .content-card.full-book h2,
    .content-card.full-book h3,
    .content-card.full-book h4,
    .content-card.full-book h5,
    .content-card.full-book h6,
    .content-card.full-book ul,
    .content-card.full-book ol {
      width: auto !important;
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }

    .content-card.full-book p {
      line-height: var(--line-height) !important;
    }

    .content-card.full-book > section {
      content-visibility: auto;
      contain-intrinsic-size: 1px 2200px;
    }

    .content-card.full-book .quran-quote,
    .content-card.full-book .quran-quote * {
      font-family: "Uthmanic Hafs Local", "Noto Naskh Arabic", "Amiri", serif !important;
      letter-spacing: 0 !important;
      word-spacing: 0.04em;
    }

    .content-card.full-book .quran-quote {
      line-height: calc(var(--line-height) + 0.15) !important;
    }

    .content-card.full-book img,
    .content-card.full-book table {
      max-width: 100% !important;
      height: auto !important;
    }

    .content-card.full-book table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-card.full-book p,
    .content-card.full-book li {
      text-indent: 0 !important;
      overflow-wrap: anywhere;
    }

    .content-card.full-book ul,
    .content-card.full-book ol {
      list-style-position: inside !important;
      padding-right: 1rem !important;
      margin-right: 0 !important;
      margin-left: 0 !important;
    }

    .content-card.full-book .MsoToc1,
    .content-card.full-book .MsoToc2 {
      width: auto !important;
      max-width: 100% !important;
      margin-right: 0 !important;
      margin-left: 0 !important;
      padding-right: 0.75rem !important;
      text-indent: 0 !important;
      white-space: normal !important;
      overflow-wrap: anywhere !important;
      tab-size: 0 !important;
    }

    .placeholder {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .placeholder h2 {
      color: var(--accent);
      margin-bottom: 0.7rem;
    }

    .panel {
      position: fixed;
      top: 0;
      height: 100vh;
      height: 100dvh;
      width: var(--panel-width);
      background: var(--surface);
      border-left: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      z-index: 210;
      padding: calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      transition: transform var(--transition);
    }

    .panel h3 {
      color: var(--accent);
      margin: 0.5rem 0 1rem;
      font-size: 1.15rem;
    }

    .panel-right {
      right: 0;
      transform: translateX(100%);
    }

    .panel-left {
      left: 0;
      transform: translateX(-100%);
      border-left: 0;
      border-right: 1px solid var(--border-color);
    }

    .panel.active {
      transform: translateX(0);
    }

    .chapters-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .chapter-link {
      display: block;
      padding: 0.7rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all var(--transition);
      font-family: "Cairo", sans-serif;
      line-height: 1.4;
      min-height: 44px;
      touch-action: manipulation;
    }

    .chapter-link:hover,
    .chapter-link.active {
      border-color: var(--accent-soft);
      background: color-mix(in srgb, var(--bg-primary) 75%, var(--surface) 25%);
      color: var(--accent);
    }

    .setting-group {
      margin-bottom: 1.1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .setting-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: "Cairo", sans-serif;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .swatch {
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0.55rem 0.4rem;
      text-align: center;
      font-family: "Cairo", sans-serif;
      font-size: 0.84rem;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      min-height: 44px;
      touch-action: manipulation;
    }

    .swatch[data-theme="light"] { background: #f8f4ef; color: #1c1007; }
    .swatch[data-theme="dark"] { background: #1a1f27; color: #f0e5d8; }
    .swatch[data-theme="sepia"] { background: #f0e7d8; color: #3d2a18; }
    .swatch[data-theme="sand"] { background: #ede2bd; color: #332b1f; }

    .swatch.active {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }

    .small-btn {
      min-width: 36px;
      border: 1px solid var(--border-color);
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 0.35rem 0.45rem;
      cursor: pointer;
      font-size: 1rem;
      min-height: 44px;
      touch-action: manipulation;
    }

    .value {
      min-width: 52px;
      text-align: center;
      font-family: "Cairo", sans-serif;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    select,
    input[type="range"] {
      width: 100%;
      touch-action: manipulation;
    }

    select {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem;
      background: var(--surface);
      color: var(--text-primary);
      font-family: "Cairo", sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(2px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .status {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      background: color-mix(in srgb, var(--surface) 85%, var(--bg-primary) 15%);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      font-size: 0.75rem;
      font-family: "Cairo", sans-serif;
      color: var(--text-secondary);
      opacity: 0;
      transform: translateY(6px);
      transition: all var(--transition);
      z-index: 220;
    }

    .status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .error {
      text-align: center;
      color: #a62f2f;
      background: #ffe9e9;
      border: 1px solid #e9b0b0;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
      line-height: 1.7;
    }

    .local-loader {
      margin-top: 1rem;
      display: grid;
      gap: 0.75rem;
    }

    .local-frame {
      width: 100%;
      min-height: 72vh;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--surface);
    }

    .local-links {
      font-family: "Cairo", sans-serif;
      font-size: 0.82rem;
      color: var(--text-secondary);
      text-align: right;
      line-height: 1.8;
      word-break: break-all;
    }

    @media (max-width: 820px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .header-controls {
        justify-content: center;
        width: 100%;
      }

      .layout {
        padding: 1rem 0.75rem 1.4rem;
      }

      .content-card {
        padding: 1rem;
      }

      .panel {
        width: min(var(--panel-width), 88vw);
      }

      .btn {
        flex: 1 1 30%;
      }
    }

    @media (max-width: 560px) {
      .brand-title {
        font-size: 1.15rem;
      }

      .brand-subtitle {
        font-size: 0.74rem;
      }

      .header-controls {
        gap: 0.45rem;
      }

      .btn {
        font-size: 0.86rem;
        padding: 0.55rem 0.65rem;
      }

      .content-card {
        border-radius: 12px;
        padding: 0.9rem;
      }

      .panel {
        width: min(94vw, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="progress-track" aria-hidden="true">
    <div id="progress-fill" class="progress-fill"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <h1 class="brand-title">بأسمائه نحيا</h1>
      <p class="brand-subtitle">قارئ الكتاب - نسخة v2 النظيفة</p>
    </div>

    <div class="header-controls">
      <a href="index.html" class="btn home-btn">الصفحة الرئيسية</a>
      <button id="chapters-btn" class="btn" type="button">الفصول</button>
      <button id="settings-btn" class="btn" type="button">الإعدادات</button>
      <button id="continue-btn" class="btn primary" type="button">استمرار القراءة</button>
    </div>
  </header>

  <aside id="chapters-panel" class="panel panel-right" aria-label="قائمة الفصول">
    <h3>الفصول</h3>
    <ul id="chapters-list" class="chapters-list"></ul>
  </aside>

  <aside id="settings-panel" class="panel panel-left" aria-label="إعدادات القارئ">
    <h3>الإعدادات</h3>

    <div class="setting-group">
      <label>المظهر</label>
      <div class="theme-grid">
        <button class="swatch" data-theme="light" type="button">فاتح</button>
        <button class="swatch" data-theme="dark" type="button">غامق</button>
        <button class="swatch" data-theme="sepia" type="button">سيبيا</button>
        <button class="swatch" data-theme="sand" type="button">رملي</button>
      </div>
    </div>

    <div class="setting-group">
      <label for="font-select">الخط</label>
      <select id="font-select">
        <option value='"Amiri", serif'>Amiri (أميري)</option>
        <option value='"Cairo", sans-serif'>Cairo (قاهرة)</option>
        <option value='"Tajawal", sans-serif'>Tajawal (تجوال)</option>
        <option value='"Noto Naskh Arabic", serif'>Noto Naskh Arabic (نسخ)</option>
      </select>
    </div>

    <div class="setting-group">
      <label>حجم الخط</label>
      <div class="row">
        <button id="font-decrease" class="small-btn" type="button">-</button>
        <span id="font-size-display" class="value">18px</span>
        <button id="font-increase" class="small-btn" type="button">+</button>
      </div>
    </div>

    <div class="setting-group">
      <label for="line-height-slider">ارتفاع السطر</label>
      <div class="row">
        <input id="line-height-slider" type="range" min="1.5" max="3" step="0.1" value="2">
        <span id="line-height-display" class="value">2.0</span>
      </div>
    </div>

    <button id="reset-btn" class="btn" type="button" style="width:100%;">إعادة تعيين إعدادات الصفحة</button>
  </aside>

  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <main class="layout">
    <article id="content" class="content-card">
      <div class="placeholder">
        <h2>مرحبًا بك في القارئ</h2>
        <p>يمكنك فتح أي فصل من قائمة الفصول، وسيتم حفظ آخر موضع قراءة تلقائيًا.</p>
      </div>
    </article>
  </main>

  <div id="autosave-indicator" class="status" role="status" aria-live="polite">تم حفظ موضع القراءة</div>

  <template id="chapter-template-chapter-1">
<section dir="rtl">
<h1>المقدمة</h1>

<h2>بسم الله الرحمن الرحيم</h2>

<p>كيف تبدأ الحديث عن من لا بداية له…؟</p>

<p>وكيف تصف من لا يُدرك كُنهه عقل، ولا يُحيط بجماله خيال…؟</p>

<p>وكيف تكتب عن الله… وأنت تعلم أنك مهما كتبت، فإن ما خفي أعظم، وما جَلَّ أوسع، وما تجلّى في القلوب أبلغ من كل حروفك؟.</p>

<p>لكنّ الله… هو الذي أمرنا أن ندعوه بأسمائه، وأخبرنا أن له الأسماء الحسنى، وأنها ليست زينة لغوية، ولا صفات نظرية، بل هي أبواب القرب، ومفاتيح الفهم، وجسور العبور إليه سبحانه.</p>

<p>ولأني – كغيري – تعبتُ كثيرًا من جفاف المعلومة، ومن الخطاب الذي يشرح أسماء الله كما تُشرح المصطلحات، كتبت هذا الكتاب…</p>

<p>كتبتُه للقلب… قبل العقل، وللخلوة… قبل الدرس، وللمناجاة… قبل الدراسة، ولكلّ من قال يومًا: "يا رب… أريد أن أعرفك، لا لأجادلك، بل لأحبك."</p>

<p>في كل مرةٍ يضيق فيها صدري، كنتُ أبحث عن اسمٍ من أسمائه… فإذا ضاقت الأرض، ناديتُه بـ الواسع، وإذا ضللت الطريق، ناديتُه بـ الهادي</p>

<p>وإذا أثقلني الذنب، لجأتُ إلى الغفور، الستّير، التواب، وإذا أحسست أنني وحدي… ذكّرني اسمه الوكيل، القريب، الحفيظ أنني لم أكن يومًا وحدي.</p>

<p>حين بدأت أكتب هذا الكتاب، لم أكن أكتب للناس… بل كنت أبحث عن الله! كنت أمدّ يدي في كل اسم… وكأنني أطرق بابًا من أبواب السماء، وكلما تعمّقت في اسمٍ، شعرت أنني أُولد من جديد…</p>

<p>هذا ليس كتابًا في العقيدة فقط، ولا في الفقه، ولا في التربية، ولا في الدعوة… هذا كتابُ الحياة مع الله… كيف تراه في كل موقف؟</p>

<p>كيف تحسّ قربه في كل لحظة؟.</p>

<p>كيف تتعامل معه باسمه، لا باسمك؟.</p>

<p>وكيف تكون عبدًا له… لا عبدًا لحاجتك فقط؟.</p>

<p>نعم… بأسمائه نحيا، لا نحيا فقط بالجسد، ولا بالتخطيط، ولا بالعلاقات…</p>

<p>بل نحيا حين نعرف من هو الله… ونعرفه كما وصف نفسه، لا كما تَصوّره الناس.</p>

<p>في هذا الكتاب… سنتعلّم فيه فقه الحب… ذلك الحب الذي يثبت عند ‏الشبهات، ويقوى عند الفتن، ولا تضعفه الشهوات إذا جاهد صاحبُه ‏نفسه… وسنتعلّم أن التقوى ليست خوفَ رعبٍ يباعد بين العبد وربه، بل ‏خوفَ تعظيمٍ يمتلئ بمحبةٍ ورجاء، وخشيةَ أن يُحجب القلب عن قربه، أو يُحرم ‏من رضاه‎.‎</p>

<p>ستجد بين الصفحات:</p>

<ul style="text-align: right; margin: 1.5rem 2rem;">
<li>تأمّلًا يعانق قلبك</li>
<li>وموقفًا من السيرة يثبتك</li>
<li>ودعاءً يُبكيك</li>
<li>وخاطرةً توقظك</li>
<li>وتصحيحًا لفكرةٍ مغلوطة ظننتها عن الله لسنين…</li>
</ul>

<p>هذا الكتاب… رسالة حُبٍّ لله، من عبدٍ لا يملك شيئًا، لكن وجد في أسماء ربه كل شيء.</p>

<p>فلنمضِ معًا… لا لنحفظ الأسماء، بل لندخلها… ونحيا بها، ونُصلّي بها، ونسجد بها، وندعو بها، ونموت عليها.</p>

<p>ولنفتح الآن الباب… باب المعرفة، باب الحب، باب العودة، باب الأنس… باب الأسماء الحسنى.</p>
</section>

  <template id="chapter-template-chapter-2">
<section dir="rtl">
<h1>منهجية العمل في هذا الكتاب</h1>

<p>هذا الكتاب ليس مجرد عرض لأسماء الله الحسنى، بل هو رحلة تربوية معرفية قلبية، تسير في ضوء الأسماء، لتربطك بالله… معرفةً، ومحبةً، وعبادةً، وسلوكًا، ومناجاةً.</p>

<p>ولأجل ذلك، اعتمدتُ في هذا الكتاب منهجًا دقيقًا متوازنًا، يجمع بين:</p>

<ul style="text-align: right; margin: 1.5rem 2rem;">
<li>التحقيق العلمي</li>
<li>والتأمل الوجداني</li>
<li>والأثر التربوي والسلوكي</li>
</ul>

<h2>أولًا: المعايير المعتمدة لاختيار الأسماء</h2>

<p><strong>الاقتصار على الأسماء الثابتة الصحيحة:</strong> بالاعتماد على ما ثبت في النصوص القرآنية والحديثية، دون التوسع في أسماء لم يرد لها أصل شرعي.</p>

<p><strong>إبراز الأسماء المفردة والمقترنة:</strong> وبيان دلالاتها المتفردة أو علاقتها بالأسماء الأخرى من حيث التوازن والكمال.</p>

<h2>ثانيًا: البناء المعتمد لكل اسم</h2>

<p>كل اسم إلهي في هذا الكتاب تمت معالجته بمنهج متكامل يتضمن العناصر الرئيسية التالية:</p>

<p><strong>1. العنوان التأملي:</strong> يقدم الاسم بأسلوب وجداني أدبي، يدخل من باب القلب، ويهيئ القارئ لمعناه، مثال: الودود… الذي يحبّك لا لأجل شيء، بل لأنه هو هكذا… ودود.</p>

<p><strong>2. المعنى اللغوي والشرعي:</strong></p>
<ul style="text-align: right; margin: 1rem 2rem;">
<li>تحليل دقيق لأصل الكلمة لغويًا</li>
<li>بيان المعنى الشرعي كما ورد في القرآن والسنة</li>
<li>أقوال السلف والعلماء</li>
</ul>

<p><strong>3. وروده في القرآن الكريم:</strong></p>
<ul style="text-align: right; margin: 1rem 2rem;">
<li>ذكر المواضع التي ورد فيها الاسم صريحًا أو معنىً</li>
<li>توظيف السياق القرآني في إبراز أبعاد الاسم</li>
</ul>

<p><strong>4. الفرق بينه وبين الأسماء المشابهة:</strong></p>
<ul style="text-align: right; margin: 1rem 2rem;">
<li>إبراز الفروق الدقيقة بين الأسماء التي قد يظن القارئ أنها مترادفة</li>
<li>بيان التكامل بينها</li>
</ul>

<p><strong>5. أثر الاسم في القلب والسلوك:</strong></p>
<ul style="text-align: right; margin: 1rem 2rem;">
<li>كيف يغيّر هذا الاسم حياتك؟</li>
<li>ما العلاقة بين معرفة هذا الاسم وبين الطمأنينة، الصبر، القوة، التوازن؟</li>
<li>ربط عملي مباشر بين الاسم وواقع المسلم</li>
</ul>

<p><strong>6. مشهد من السيرة يجسد الاسم:</strong> استخراج موقف من السيرة النبوية أو حياة الصحابة يوضح كيف تجلى هذا الاسم واقعيًا، مع التركيز على البُعد الإيماني والتربوي للموقف.</p>

<p><strong>7. دعاء خاص مستلهم من الاسم:</strong> صياغة دعاء وجداني عميق باسم الله، يمزج بين الرجاء والخضوع، والحاجة والاعتراف.</p>

<p><strong>8. تصحيح مفاهيم وانحرافات شائعة:</strong> معالجة الانحرافات العقدية أو النفسية المرتبطة بفهم الاسم، وبيان التوازن الصحيح في التعامل معه.</p>

<p><strong>9. نصيحة مهيبة من خلال الاسم:</strong> في كل اسم من أسماء الله الحسنى، تتجلّى دعوة خفية، ونداء مهيب إلى القلب، يُنبّهك إلى أمر خطير، أو يُرشدك إلى بابٍ من أبواب النجاة.</p>

<p><strong>10. كيف أكون مستحقًا لفضل هذا الاسم؟:</strong> يُبيّن الأعمال القلبية أو الجوارحية التي تجعل العبد في مقامٍ يؤهله لأن ينال من بركة الاسم، ويُصبح في دائرة رحمته.</p>

<p><strong>11. المقصد العقدي لهذا الاسم:</strong> يُقصد به الحقيقة الإيمانية المركزية التي يُرسّخها هذا الاسم في عقيدة المؤمن، والركيزة التوحيدية التي يُبنى عليها فهم العبد لربّه.</p>

<h2>ثالثًا: اللغة والأسلوب</h2>

<p><strong>الأسلوب:</strong> مزج بين اللغة الأدبية الراقية، والوضوح الشرعي، دون تعقيد فلسفي أو سطحية عاطفية.</p>

<p><strong>النبرة:</strong> وجدانية خاشعة، مؤنِسة، تخاطب القلب والعقل معًا.</p>

<p><strong>الاقتباسات:</strong> اختيار أقوال منتقاة بدقة من العلماء المحققين، بدون حشو.</p>

<h2>رابعًا: الأهداف المرجوّة من الكتاب</h2>

<ul style="text-align: right; margin: 1.5rem 2rem;">
<li>أن يحيا القارئ بأسماء الله لا أن يحفظها فقط</li>
<li>أن تنبعث من كل اسم طاقة إيمانية، وسلوك عملي</li>
<li>أن نعيد ترميم العلاقة مع الله من جديد… عبر أسمائه</li>
<li>أن نعلّم الناس فقه الحب لله، وفقه التقوى منه… لا بالخوف المجرّد، ولا بالمعلومة الباردة</li>
</ul>
</section>

  <template id="chapter-template-chapter-3">
<section dir="rtl">
<h1>لماذا نعرف الله بأسمائه؟</h1>

<p>لأن أعظم علمٍ على وجه الأرض هو العلم بالله، قال ابن القيم رحمه الله:</p>

<p style="text-align: center; font-style: italic; margin: 1.5rem 0; color: #6b5d4f;">
"أفضل ما اكتسبته القلوب، وتنافس فيه المتنافسون، هو معرفة الله بأسمائه وصفاته."
</p>

<p>فمن عرفه… أحبه، ومن أحبه… خافه، ورجاه، وتوكّل عليه، ولم يُعرض عنه طرفة عين.</p>

<p>وقد أمرنا الله مباشرة أن ندعوه بأسمائه: {وَلِلَّهِ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ فَٱدْعُوهُ بِهَا} الأعراف: 180.</p>

<p>فهذه الأسماء ليست للتنظير… بل للعمل، والدعاء، والعبادة، والمعرفة، والمناجاة.</p>

<p>والعبد لا يثبت في الفتن، ولا يصبر على البلاء، ولا يُقبل على الطاعة، إلا إذا عرف من هو ربه… إذا عرف أنه الرحيم… الغفور… القريب… النافع… الحفيظ… الودود.</p>

<p>وكلما زادت معرفتك بأسمائه، زاد حبك له، وكلما زاد حبك… زادت تقواك، وكلما زادت تقواك… كنت أصدق عبد، وأقرب قلب، وأثبت قدمًا على طريقه.</p>

<p>فبأسمائه… نُحيي القلوب بعد مواتها، ونبني علاقة صادقة معه، ونسير إليه، وهو ينتظرنا.</p>

<h2>تنويه هام في مقدمة هذا الجزء</h2>

<p>هذا الجزء من الكتاب خُصّص بالكامل للتأمل والتدبر في أسماء الله الحسنى التي يغلب عليها طابع الجمال والرَّحمة، وتم اختيارها بعناية لتكون مدخلًا رقيقًا ودافئًا إلى عالم الأسماء الإلهية.</p>

<p>وقد آثرتُ أن تكون هذه الأسماء وحدها محور هذا الجزء الأول، دون الانتقال إلى أسماء الجلال أو الكمال، حتى نعطي لكل مقام حقَّه من التذوق والتأمل، ونمنح القارئ فرصة التفاعل العميق مع هذه الرحمة الإلهية المتدفقة من كل اسم.</p>

<p>وفي الأجزاء القادمة، سنواصل المسير بإذن الله في رياض الأسماء الأخرى، حيث الجلال والكمال والقدرة والحكمة، في توازنٍ يليق بجمال هذا الدين وكمال هذا الرب العظيم.</p>

<h2>أهمية معرفة الله بأسمائه الحسنى (شرعيًا وتربويًا)</h2>

<h3>أولًا: من المنظور الشرعي</h3>

<p><strong>1. أعظم أبواب الإيمان بالله:</strong> الإيمان بالله هو أول أركان الإيمان، وأعظم ما يُعرف به الله: أسماؤه وصفاته، قال تعالى:{وَلِلَّهِ الأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا} الأعراف: 180، فجعل الأسماء وسيلة للدعاء، والعبادة، والاقتراب.</p>

<p><strong>2. النجاة متوقفة على معرفته بأسمائه:</strong> قال النبي ﷺ: "إن لله تسعةً وتسعين اسمًا، مَن أحصاها دخل الجنة"، رواه البخاري ومسلم، والإحصاء هنا ليس عدًّا فقط، بل فهمًا، وتدبرًا، وعملاً، ودعاءً.</p>

<p><strong>3. القرآن نفسه قائم على الأسماء:</strong> كل سورة من سور القرآن تبدأ باسم أو تنتهي به، وكل قصة من قصصه تُختم باسمٍ يناسب السياق، ليتعلّم العبد كيف يرى يد الله في كل مشهد، وكيف يُسقط اسمه على واقعه.</p>

<p><strong>4. العقيدة الصحيحة لا تُبنى بدونها:</strong> انحرافات الفرق الضَّالة كانت تبدأ دائمًا من الفهم الخاطئ لأسماء الله، إما بإثبات ما لم يثبت، أو بنفي ما أثبته الله لنفسه.</p>

<h3>ثانيًا: من المنظور التربوي والسلوكي</h3>

<p><strong>1. الطريق الحقيقي إلى محبة الله:</strong> قال ابن القيم: "الطريق إلى الله هو معرفة أسمائه وصفاته، فمن عرفه بها أحبه لا محالة" لأنك لا تحب من تجهله… وكلما عرفت أنه "الرحيم، الودود، الحليم، الستّير" وقعت المحبة في قلبك دون استئذان.</p>

<p><strong>2. تُغذّي الخشوع والأنس في العبادة:</strong> من قال "الله أكبر" وهو يعرف أن الله هو العليّ الكبير… خشع. ومن قال "استغفر الله" وهو يعرف أنه الغفور الرحيم التواب….. أقبل. الأسماء تَمنح للعبادة روحًا لا تمنحها الجوارح وحدها.</p>

<p><strong>3. تصنع التوازن النفسي والسلوكي:</strong> من عرف أن الله العليم الحكيم….. رضي بقضائه. ومن عرف أنه الرزاق القابض الباسط… لم يجزع عند الفقر. ومن عرف أنه الستّير… ستر الناس ولم يفضح. ومن عرف أنه الشَّكور… لم يستقلّ الطاعات.</p>

<p><strong>4. تبني العبودية الصادقة لله:</strong> كل اسم يفتح أمامك باب عبودية خاص:
<ul style="text-align: right; margin: 1rem 2rem;">
<li>"الغني": عبودية الزهد والتجرد</li>
<li>"القوي": عبودية الاستعانة</li>
<li>"الحكيم": عبودية التسليم</li>
<li>"الرَّحيم": عبودية الرجاء</li>
</ul>
</p>

<p><strong>5. تُحيي القلب وتُصلح العمل:</strong> القلب الذي يعرف "الشهيد" لا يخون، والقلب الذي يعرف "الرقيب" لا يغفل، والقلب الذي يعرف "الودود" لا ييأس، فمعرفة الأسماء ليست فقط لحظات إيمانية… بل منهج حياة.</p>

<h3>خلاصة الأمر</h3>

<p style="text-align: center; font-style: italic; margin: 1.5rem 0; color: #c9945d; font-size: 1.1rem;">
معرفة الله بأسمائه الحسنى هي أصل كل صلاح، ومنبع كل طمأنينة، وباب كل توبة، وبداية كل طريق يُوصل إلى رضا الله.
</p>

<h2>لماذا "بأسمائه نحيا"؟</h2>

<p>لأن الحياة لا تُحيا حقًا إلا بالله، ولا يُعرف الله حقًا إلا بأسمائه… وكلما تعرّف القلب على اسمٍ من أسمائه، انفتح له باب من النور، وكلما تدبّر العبد معاني أسمائه الحسنى، أحبه، وهابه، واقترب منه.</p>

<p>فهذا الكتاب لم يُكتب ليكون مجرد دراسة في العقيدة، ولا مادة نظرية في معاني الصفات، بل هو محاولة جادّة لأن نعيش بأسمائه… لا أن نحفظها فقط.</p>

<p>سميته "بأسمائه نحيا" لأنني رأيت – من أعماق التجربة واليقين – أن من يحيا بأسمائه… يحيا بقلبٍ ثابت، وروحٍ مطمئنة، وسلوكٍ مستقيم، لأنه لم يعد يعبد إلهًا بعيدًا، بل ربًا يعرفه… رحيمًا في رحمته، عدلًا في قهره، ستّارًا في عفوه، حكيمًا في منعه، كريمًا في عطائه.</p>

<p>ولأن الدين في جوهره حبٌّ لله، وخشيةٌ منه، جاء العنوان الفرعي: "فقه الحب والتقوى في الأسماء الحسنى" فالحبُّ هو جوهر العلاقة، والتقوى هي ثمرة هذا الحب… فكلما أحببته، راقبته، وخشيته، وأقبلت عليه، وابتعدت عما يُغضبه.</p>

<p>فهذا الكتاب دعوة لأن نُحيي أرواحنا بهذين الجناحين: حبٌ يُقرّب، وتقوى تُطهّر، وكل ذلك… من خلال التأمل العميق في أسمائه التي نعيش بها، ونسجد لها، ونلقاه عليها.</p>
</section>

  <template id="chapter-template-chapter-4">
<section dir="rtl">
<h1>لماذا هذا الكتاب؟</h1>

<p>كُتب هذا الكتاب بدافع حبٍ وخشية وأمل، حب للقرآن وأسماء الله، وخشية من أن يمرّ القارئ على هذه الأسماء دون أن يعيش بها، وأمل في أن يعود الناس إلى التأمل العميق، والتعايش الحقيقي مع أسماء الله لا مجرد الحفظ والدراسة النظرية.</p>

<h2>المشكلة التي واجهتنا</h2>

<p>لقد لاحظت – من خلال السنوات الماضية – أن معظم كتب الأسماء الحسنى تركز على الجانب العلمي والنظري فقط، فتقدم الاسم كمعلومة تُحفظ، وليس كباب حب وقرب من الله.</p>

<p>كنتُ أرى القارئ يحفظ الأسماء لكن قلبه لا يحيا بها، يعرف معاني الأسماء لكن لا يشعر بتأثيرها في حياته، يدرسها في الكتب لكن لا يدعو بها في الليل.</p>

<p>والحياة الحقيقية مع الله لا تُبنى على المعلومات وحدها، بل على الحب والمعرفة والعمل والمناجاة.</p>

<h2>رؤيتي للحل</h2>

<p>لذا جاء هذا الكتاب كمحاولة جادة لتقديم أسماء الله بطريقة مختلفة:</p>

<ul style="text-align: right; margin: 1.5rem 2rem;">
<li>تخاطب القلب قبل العقل</li>
<li>تجمع بين العلم والعمل</li>
<li>تربط بين التأمل والسلوك</li>
<li>تفتح باب الدعاء والمناجاة</li>
<li>تُغني الحياة، لا تُثقلها بالمعلومات</li>
</ul>

<h2>مقصد الكتاب الأساسي</h2>

<p>أن تحيا بأسماء الله، لا أن تحفظها فقط.</p>

<p>أن تعرف الله بها، لا أن تعرف الأسماء عن الله.</p>

<p>أن تشعر بقربه في كل لحظة من خلالها.</p>

<p>أن تدعوه بها، وتسجد لها، وتخافه من خلالها، وتحبه بها.</p>

<p>أن تغير هذه الأسماء حياتك، وتصبح منهج تعاملك مع الله والحياة.</p>

<h2>ماذا تتوقع من هذا الكتاب؟</h2>

<p>عندما تنهي قراءة فصل من هذا الكتاب، لا تتوقع أن تكون قد حفظت معنى الاسم فقط، بل تتوقع:</p>

<ul style="text-align: right; margin: 1.5rem 2rem;">
<li>أن يكون قلبك قد انقدح فيه نور من أسماء الله</li>
<li>أن تشعر برغبة في الدعاء به في خلوتك</li>
<li>أن تفهم كيف يؤثر هذا الاسم في حياتك العملية</li>

  <script>
    (() => {
      const CHAPTERS = [
        { id: 'chapter-full', title: 'النص الكامل للكتاب' }
      ];
      const CHAPTER_SOURCES = {
        'chapter-full': 'chapters/part4-full.html'
      };

      const STORAGE_PREFIX = 'asma_p4_v2_';

      const defaults = {
        theme: 'light',
        font: '"Amiri", serif',
        fontSize: 18,
        lineHeight: 2
      };

      const state = {
        currentChapter: 'chapter-full',
        saveTimer: null,
        resizeTimer: null,
        lastScrollY: 0,
        readingBlocks: [],
        tocEntries: [],
        chapterHtmlCache: {}
      };

      const dom = {
        content: document.getElementById('content'),
        chaptersList: document.getElementById('chapters-list'),
        chaptersPanel: document.getElementById('chapters-panel'),
        settingsPanel: document.getElementById('settings-panel'),
        overlay: document.getElementById('overlay'),
        progressFill: document.getElementById('progress-fill'),
        autosave: document.getElementById('autosave-indicator'),
        topbar: document.querySelector('.topbar'),
        chaptersBtn: document.getElementById('chapters-btn'),
        settingsBtn: document.getElementById('settings-btn'),
        continueBtn: document.getElementById('continue-btn'),
        fontSelect: document.getElementById('font-select'),
        fontIncrease: document.getElementById('font-increase'),
        fontDecrease: document.getElementById('font-decrease'),
        fontSizeDisplay: document.getElementById('font-size-display'),
        lineHeightSlider: document.getElementById('line-height-slider'),
        lineHeightDisplay: document.getElementById('line-height-display'),
        resetBtn: document.getElementById('reset-btn')
      };

      function storageSet(key, value) {
        try {
          localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
        } catch (error) {
          console.warn('Storage write failed:', error);
        }
      }

      function storageGet(key, fallback = null) {
        try {
          const raw = localStorage.getItem(STORAGE_PREFIX + key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function storageRemove(key) {
        try {
          localStorage.removeItem(STORAGE_PREFIX + key);
        } catch {
          // no-op
        }
      }

      function getCurrentSettings() {
        return {
          theme: document.body.dataset.theme || 'light',
          font: dom.fontSelect.value,
          fontSize: parseInt(dom.fontSizeDisplay.textContent, 10),
          lineHeight: parseFloat(dom.lineHeightDisplay.textContent)
        };
      }

      function setTheme(theme) {
        document.body.dataset.theme = theme;
        document.body.classList.remove('theme-dark', 'theme-sepia', 'theme-sand');
        if (theme !== 'light') {
          document.body.classList.add('theme-' + theme);
        }

        document.querySelectorAll('.swatch').forEach((swatch) => {
          swatch.classList.toggle('active', swatch.dataset.theme === theme);
        });
      }

      function applySettings(settings) {
        const safe = { ...defaults, ...settings };

        setTheme(safe.theme);
        document.documentElement.style.setProperty('--font-family', safe.font);
        document.documentElement.style.setProperty('--font-size', safe.fontSize + 'px');
        document.documentElement.style.setProperty('--line-height', safe.lineHeight);

        dom.fontSelect.value = safe.font;
        dom.fontSizeDisplay.textContent = safe.fontSize + 'px';
        dom.lineHeightSlider.value = safe.lineHeight;
        dom.lineHeightDisplay.textContent = safe.lineHeight.toFixed(1);
      }

      function persistSettings() {
        storageSet('settings', getCurrentSettings());
      }

      function setPanelState(isOpen) {
        document.body.classList.toggle('panel-open', isOpen);
        dom.overlay.classList.toggle('active', isOpen);
      }

      function openPanel(panel) {
        const isChapterPanel = panel === dom.chaptersPanel;
        dom.chaptersPanel.classList.toggle('active', isChapterPanel);
        dom.settingsPanel.classList.toggle('active', !isChapterPanel);
        setPanelState(true);
      }

      function closePanels() {
        dom.chaptersPanel.classList.remove('active');
        dom.settingsPanel.classList.remove('active');
        setPanelState(false);
      }

      function renderChapters() {
        dom.chaptersList.innerHTML = CHAPTERS.map((chapter, index) => {
          return `<li><a href="#${chapter.id}" class="chapter-link" data-chapter="${chapter.id}">${index + 1}. ${chapter.title}</a></li>`;
        }).join('');

        dom.chaptersList.addEventListener('click', (event) => {
          const link = event.target.closest('.chapter-link');
          if (!link) {
            return;
          }

          event.preventDefault();

          const targetSelector = link.dataset.target;
          if (targetSelector && state.currentChapter === 'chapter-full') {
            const target = resolveContentTarget(targetSelector);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              setTimeout(() => {
                storageSet(`pos_${state.currentChapter}`, getCurrentReadingPosition());
                storageSet('lastChapter', state.currentChapter);
              }, 120);
              closePanels();
              showAutosaveIndicator();
              return;
            }
          }

          loadChapter(link.dataset.chapter);
          closePanels();
        });
      }

      function slugifyArabic(text) {
        return (text || '')
          .replace(/ /g, ' ')
          .trim()
          .replace(/[ً-ٰٟ]/g, '')
          .replace(/[^؀-ۿ\w\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '')
          .slice(0, 80);
      }

      function resolveContentTarget(targetSelector) {
        if (!targetSelector) {
          return null;
        }

        if (targetSelector.startsWith('#')) {
          const anchorName = targetSelector.slice(1);
          return dom.content.querySelector(`[id="${CSS.escape(anchorName)}"]`)
            || dom.content.querySelector(`[name="${CSS.escape(anchorName)}"]`)
            || document.getElementById(anchorName)
            || document.querySelector(`[name="${CSS.escape(anchorName)}"]`);
        }

        return dom.content.querySelector(targetSelector);
      }

      function buildInlineContentsList() {
        if (!dom.chaptersList) {
          return;
        }

        state.tocEntries = [];
        const items = [];
        const seen = new Set();
        const addItem = (title, selector, level = 1) => {
          const cleanTitle = (title || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
          if (!cleanTitle || cleanTitle.length < 2 || seen.has(selector)) {
            return;
          }
          seen.add(selector);
          items.push({ title: cleanTitle, selector, level });
        };

        const dedicationHeading = Array.from(dom.content.querySelectorAll('p, h1, h2, h3'))
          .find((el) => (el.textContent || '').includes('الإهداء'));
        if (dedicationHeading) {
          if (!dedicationHeading.id) {
            dedicationHeading.id = 'section-dedication';
          }
          addItem('الإهداء', `#${dedicationHeading.id}`, 1);
        }

        const tocLinks = Array.from(dom.content.querySelectorAll('.MsoToc1 a[href^="#"], .MsoToc2 a[href^="#"]'));
        tocLinks.forEach((link) => {
          const href = link.getAttribute('href');
          if (!href) {
            return;
          }
          const level = link.closest('.MsoToc2') ? 2 : 1;
          addItem(link.textContent, href, level);
        });

        if (!items.length) {
          Array.from(dom.content.querySelectorAll('h2, h3')).forEach((heading) => {
            const title = (heading.textContent || '').trim();
            if (!title) {
              return;
            }
            if (!heading.id) {
              heading.id = `section-${slugifyArabic(title) || Math.random().toString(36).slice(2, 8)}`;
            }
            addItem(title, `#${heading.id}`, heading.tagName === 'H3' ? 2 : 1);
          });
        }

        if (!items.length) {
          return;
        }

        dom.chaptersList.innerHTML = items.map((item, index) => `
          <li>
            <a href="${item.selector}" class="chapter-link chapter-link-inline level-${item.level}" data-chapter="chapter-full" data-target="${item.selector}">
              ${item.level === 1 ? `${index + 1}. ` : ''}${item.title}
            </a>
          </li>
        `).join('');

        state.tocEntries = Array.from(dom.chaptersList.querySelectorAll('.chapter-link-inline')).map((link) => ({
          link,
          selector: link.dataset.target,
          target: resolveContentTarget(link.dataset.target)
        })).filter((entry) => entry.target);

        updateActiveContentsEntry();
      }

      function indexReadingBlocks() {
        const blocks = Array.from(dom.content.querySelectorAll('h1, h2, h3, p, li, blockquote'))
          .filter((el) => {
            const text = (el.textContent || '').replace(/ /g, ' ').trim();
            return text.length > 2;
          });

        state.readingBlocks = blocks;
        blocks.forEach((block, index) => {
          block.dataset.readingIndex = String(index);
          if (!block.id) {
            const label = slugifyArabic(block.textContent || '');
            if (label) {
              block.id = `reading-${index}-${label}`;
            }
          }
        });
      }

      function getCurrentReadingPosition() {
        const blocks = state.readingBlocks || [];
        if (!blocks.length) {
          return { y: window.scrollY };
        }

        const threshold = window.scrollY + 140;
        let current = blocks[0];
        for (const block of blocks) {
          if (block.offsetTop <= threshold) {
            current = block;
          } else {
            break;
          }
        }

        const offset = Math.max(0, window.scrollY - current.offsetTop);
        return {
          y: window.scrollY,
          index: Number(current.dataset.readingIndex || 0),
          id: current.id || null,
          offset
        };
      }

      function restoreSavedPosition(chapterId) {
        const saved = storageGet(`pos_${chapterId}`, 0);
        const applyRestore = () => {
          if (saved && typeof saved === 'object') {
            let target = null;
            if (saved.id) {
              target = dom.content.querySelector(`#${CSS.escape(saved.id)}`);
            }
            if (!target && Number.isInteger(saved.index)) {
              target = state.readingBlocks[saved.index] || null;
            }
            if (target) {
              window.scrollTo({ top: Math.max(0, target.offsetTop + (saved.offset || 0)), behavior: 'auto' });
              updateProgressBar();
              return true;
            }
            if (typeof saved.y === 'number') {
              window.scrollTo({ top: saved.y, behavior: 'auto' });
              updateProgressBar();
              return true;
            }
          }
          if (typeof saved === 'number') {
            window.scrollTo({ top: saved, behavior: 'auto' });
            updateProgressBar();
            return true;
          }
          return false;
        };

        [80, 220, 500].forEach((delay) => {
          setTimeout(applyRestore, delay);
        });
      }

      async function getInlineChapterHtml(chapterId) {
        if (state.chapterHtmlCache[chapterId]) {
          return state.chapterHtmlCache[chapterId];
        }

        const template = document.getElementById(`chapter-template-${chapterId}`);
        if (template) {
          const html = template.innerHTML.trim();
          state.chapterHtmlCache[chapterId] = html;
          return html;
        }

        const source = CHAPTER_SOURCES[chapterId];
        if (!source) {
          return '';
        }

        try {
          const response = await fetch(source, { cache: 'force-cache' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const html = (await response.text()).trim();
          state.chapterHtmlCache[chapterId] = html;
          return html;
        } catch (error) {
          console.error('Failed to fetch chapter source:', source, error);
          return '';
        }
      }

      function normalizeFullChapterLayout() {
        // Remove hidden Word field artifacts and empty spacer paragraphs.
        dom.content.querySelectorAll(
          'span[style*="mso-hide:screen"], span[style*="display:none"], [style*="mso-element:field-begin"], [style*="mso-element:field-separator"], [style*="mso-element:field-end"]'
        ).forEach((el) => el.remove());

        // Remove stray marker text carried from the DOC export.
        dom.content.querySelectorAll('p').forEach((p) => {
          const compactText = (p.textContent || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          if (/^ض\s*-\+\s*$/.test(compactText)) {
            p.remove();
          }
        });

        const paragraphs = dom.content.querySelectorAll('p');
        paragraphs.forEach((p, index) => {
          // Focus on the opening pages where the imported spacing is usually broken.
          if (index > 1200) {
            return;
          }
          const text = (p.textContent || '').replace(/\u00a0/g, '').trim();
          if (!text) {
            p.remove();
            return;
          }
          p.style.width = 'auto';
          p.style.maxWidth = '100%';
          p.style.marginLeft = '0';
          p.style.marginRight = '0';
          p.style.textIndent = '0';
          p.style.paddingRight = '0';
          if (!p.hasAttribute('align')) {
            p.style.textAlign = 'justify';
          }
        });

        // Tighten oversized imported Word styling on small screens.
        if (window.matchMedia('(max-width: 820px)').matches) {
          const openingBlocks = Array.from(dom.content.querySelectorAll('p, h1, h2, h3')).slice(0, 220);
          openingBlocks.forEach((block) => {
            const inlineSized = [block, ...block.querySelectorAll('[style*="font-size"]')];
            inlineSized.forEach((el) => {
              const styleText = (el.getAttribute('style') || '');
              const match = styleText.match(/font-size:\s*([0-9.]+)pt/i);
              if (!match) {
                return;
              }
              const pt = parseFloat(match[1]);
              if (pt >= 30) {
                el.style.fontSize = '1.9rem';
              } else if (pt >= 24) {
                el.style.fontSize = '1.5rem';
              } else if (pt >= 20) {
                el.style.fontSize = '1.25rem';
              }
            });
          });

          Array.from(dom.content.querySelectorAll('span[style*="position:absolute"], div[style*="position:absolute"]'))
            .slice(0, 120)
            .forEach((el) => {
              el.style.left = 'auto';
              el.style.right = 'auto';
              el.style.maxWidth = '100%';
            });
        }

        // Keep list/TOC numbering inside the page boundaries.
        dom.content.querySelectorAll('.MsoToc1, .MsoToc2, ul, ol, li').forEach((el) => {
          el.style.maxWidth = '100%';
          el.style.marginLeft = '0';
          el.style.marginRight = '0';
          el.style.textIndent = '0';
          if (el.tagName === 'UL' || el.tagName === 'OL') {
            el.style.paddingRight = '1rem';
            el.style.listStylePosition = 'inside';
          }
        });

        // Opening pages from Word sometimes force LTR-ish alignment by inline styles.
        dom.content.querySelectorAll('p[align="left"][dir="RTL"]').forEach((p) => {
          p.style.textAlign = 'right';
        });

        // Center the dedication block and neutralize absolute wrappers around it.
        const dedicationHeading = Array.from(dom.content.querySelectorAll('p, h1, h2, h3'))
          .find((el) => (el.textContent || '').includes('الإهداء'));

        if (!dedicationHeading) {
          return;
        }

        let ancestor = dedicationHeading.parentElement;
        while (ancestor && ancestor !== dom.content) {
          const styleText = (ancestor.getAttribute('style') || '').toLowerCase();
          if (
            styleText.includes('position:absolute') ||
            styleText.includes('left:-48px') ||
            styleText.includes('top:-536px')
          ) {
            ancestor.style.position = 'static';
            ancestor.style.left = 'auto';
            ancestor.style.top = 'auto';
            ancestor.style.width = 'auto';
            ancestor.style.height = 'auto';
            ancestor.style.transform = 'none';
            ancestor.style.margin = '0 auto';
          }
          ancestor = ancestor.parentElement;
        }

        const dedicationBlock = dedicationHeading.closest('.shape') || dedicationHeading.parentElement;
        if (!dedicationBlock) {
          return;
        }

        dedicationBlock.style.maxWidth = '46rem';
        dedicationBlock.style.margin = '0 auto';
        dedicationBlock.style.textAlign = 'center';
        dedicationBlock.querySelectorAll('p').forEach((p) => {
          p.style.textAlign = 'center';
          p.style.marginRight = '0';
          p.style.marginLeft = '0';
        });
      }

      function decorateQuranContent() {
        const candidates = dom.content.querySelectorAll('p, li, blockquote, h1, h2, h3, td, th');
        const basmalaPattern = /^(بسم الله الرحمن الرحيم|بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيم)$/;

        candidates.forEach((el) => {
          const text = (el.textContent || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          const hasQuranQuotes = text.includes('﴿') && text.includes('﴾');
          const isBasmala = basmalaPattern.test(text);

          el.classList.toggle('quran-quote', hasQuranQuotes || isBasmala);
        });
      }

      function optimizeContentImages() {
        const images = Array.from(dom.content.querySelectorAll('img'));
        images.forEach((img, index) => {
          if (!img.hasAttribute('width') && img.naturalWidth) {
            img.setAttribute('width', String(img.naturalWidth));
          }
          if (!img.hasAttribute('height') && img.naturalHeight) {
            img.setAttribute('height', String(img.naturalHeight));
          }
          img.decoding = 'async';
          if (index > 0) {
            img.loading = 'lazy';
          }
        });
      }

      function updateTopbarAutoHide() {
        if (!dom.topbar) {
          return;
        }
        const currentY = window.scrollY || 0;
        const delta = currentY - state.lastScrollY;

        if (currentY <= 24) {
          dom.topbar.classList.remove('is-hidden');
          state.lastScrollY = currentY;
          return;
        }

        if (delta > 8) {
          dom.topbar.classList.add('is-hidden');
        } else if (delta < -8) {
          dom.topbar.classList.remove('is-hidden');
        }

        state.lastScrollY = currentY;
      }

      function markActiveChapter(chapterId) {
        document.querySelectorAll('.chapter-link').forEach((link) => {
          const inlineTarget = link.dataset.target;
          if (inlineTarget && state.currentChapter === 'chapter-full') {
            return;
          }
          link.classList.toggle('active', link.dataset.chapter === chapterId);
        });
      }

      function updateActiveContentsEntry() {
        if (state.currentChapter !== 'chapter-full' || !state.tocEntries.length) {
          return;
        }

        const threshold = window.scrollY + 160;
        let activeEntry = null;
        for (const entry of state.tocEntries) {
          if (!entry.target) {
            continue;
          }
          if (entry.target.offsetTop <= threshold) {
            activeEntry = entry;
          } else {
            break;
          }
        }

        if (!activeEntry) {
          activeEntry = state.tocEntries[0] || null;
        }

        document.querySelectorAll('.chapter-link-inline').forEach((link) => {
          link.classList.toggle('active', activeEntry ? link === activeEntry.link : false);
        });
      }

      function showAutosaveIndicator() {
        dom.autosave.classList.add('show');
        setTimeout(() => {
          dom.autosave.classList.remove('show');
        }, 1200);
      }

      function updateProgressBar() {
        const top = window.scrollY;
        const height = document.documentElement.scrollHeight - window.innerHeight;
        const progress = height > 0 ? (top / height) * 100 : 0;
        dom.progressFill.style.width = `${Math.max(0, Math.min(100, progress))}%`;
        updateActiveContentsEntry();
      }

      function savePositionDebounced() {
        clearTimeout(state.saveTimer);
        state.saveTimer = setTimeout(() => {
          storageSet(`pos_${state.currentChapter}`, getCurrentReadingPosition());
          showAutosaveIndicator();
        }, 250);
      }

      async function loadChapter(chapterId) {
        if (!CHAPTERS.some((chapter) => chapter.id === chapterId)) {
          chapterId = CHAPTERS[0].id;
        }
        state.currentChapter = chapterId;
        storageSet('lastChapter', chapterId);
        markActiveChapter(chapterId);

        dom.content.innerHTML = '<div class="placeholder"><p>جاري تحميل الفصل...</p></div>';
        const chapterHtml = await getInlineChapterHtml(chapterId);
        if (!chapterHtml) {
          dom.content.innerHTML = `
            <div class="error">
              تعذر تحميل محتوى هذا الفصل.<br>
              حاول إعادة تحميل الصفحة.
            </div>
          `;
          return;
        }

        dom.content.innerHTML = chapterHtml;
        optimizeContentImages();
        dom.content.classList.toggle('full-book', chapterId === 'chapter-full');
        if (chapterId === 'chapter-full') {
          requestAnimationFrame(() => {
            normalizeFullChapterLayout();
            decorateQuranContent();
            buildInlineContentsList();
          });
        } else {
          state.tocEntries = [];
        }
        indexReadingBlocks();
        if (dom.topbar) {
          dom.topbar.classList.remove('is-hidden');
        }
        restoreSavedPosition(chapterId);
      }

      function findDedicationPosition() {
        const dedicationHeading = Array.from(dom.content.querySelectorAll('p, h1, h2, h3'))
          .find((el) => (el.textContent || '').includes('الإهداء'));
        if (!dedicationHeading) {
          return 0;
        }
        return Math.max(0, dedicationHeading.getBoundingClientRect().top + window.scrollY - 80);
      }

      async function openDedicationPage() {
        await loadChapter(CHAPTERS[0].id);
        setTimeout(() => {
          window.scrollTo({ top: findDedicationPosition(), behavior: 'auto' });
          updateProgressBar();
        }, 180);
      }

      async function continueReading() {
        const lastChapter = storageGet('lastChapter', CHAPTERS[0].id);
        if (!CHAPTERS.some((chapter) => chapter.id === lastChapter)) {
          await requestAnimationFrame(() => {
            openDedicationPage();
          });
          return;
        }
        await loadChapter(lastChapter);
      }

      function resetSettings() {
        storageRemove('settings');
        applySettings(defaults);
        persistSettings();
      }

      function wireEvents() {
        dom.chaptersBtn.addEventListener('click', () => openPanel(dom.chaptersPanel));
        dom.settingsBtn.addEventListener('click', () => openPanel(dom.settingsPanel));
        dom.continueBtn.addEventListener('click', continueReading);

        dom.overlay.addEventListener('click', closePanels);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            closePanels();
          }
        });

        document.querySelectorAll('.swatch').forEach((swatch) => {
          swatch.addEventListener('click', () => {
            setTheme(swatch.dataset.theme);
            persistSettings();
          });
        });

        dom.fontSelect.addEventListener('change', () => {
          document.documentElement.style.setProperty('--font-family', dom.fontSelect.value);
          persistSettings();
        });

        dom.fontIncrease.addEventListener('click', () => {
          const current = parseInt(dom.fontSizeDisplay.textContent, 10);
          const next = Math.min(32, current + 1);
          dom.fontSizeDisplay.textContent = `${next}px`;
          document.documentElement.style.setProperty('--font-size', `${next}px`);
          persistSettings();
        });

        dom.fontDecrease.addEventListener('click', () => {
          const current = parseInt(dom.fontSizeDisplay.textContent, 10);
          const next = Math.max(12, current - 1);
          dom.fontSizeDisplay.textContent = `${next}px`;
          document.documentElement.style.setProperty('--font-size', `${next}px`);
          persistSettings();
        });

        dom.lineHeightSlider.addEventListener('input', () => {
          const value = parseFloat(dom.lineHeightSlider.value);
          dom.lineHeightDisplay.textContent = value.toFixed(1);
          document.documentElement.style.setProperty('--line-height', value);
          persistSettings();
        });

        dom.resetBtn.addEventListener('click', resetSettings);

        window.addEventListener('scroll', () => {
          updateProgressBar();
          savePositionDebounced();
          updateTopbarAutoHide();
        }, { passive: true });

        const forceSave = () => {
          if (!state.currentChapter) {
            return;
          }
          storageSet(`pos_${state.currentChapter}`, getCurrentReadingPosition());
          storageSet('lastChapter', state.currentChapter);
        };

        window.addEventListener('pagehide', forceSave);
        window.addEventListener('beforeunload', forceSave);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            forceSave();
          }
        });

        window.addEventListener('resize', () => {
          clearTimeout(state.resizeTimer);
          state.resizeTimer = setTimeout(() => {
            updateProgressBar();
            if (state.currentChapter === 'chapter-full') {
              normalizeFullChapterLayout();
            }
            if (window.innerWidth > 820) {
              closePanels();
            }
          }, 160);
        }, { passive: true });
      }

      async function init() {
        renderChapters();

        const savedSettings = storageGet('settings', defaults);
        applySettings(savedSettings);
        wireEvents();
        state.lastScrollY = window.scrollY || 0;

        const chapterFromHash = location.hash.replace('#', '');
        const validHash = CHAPTERS.some((chapter) => chapter.id === chapterFromHash);
        const savedChapter = storageGet('lastChapter', CHAPTERS[0].id);
        const validSavedChapter = CHAPTERS.some((chapter) => chapter.id === savedChapter)
          ? savedChapter
          : CHAPTERS[0].id;
        const initialChapter = validHash
          ? chapterFromHash
          : validSavedChapter;

        if (validHash) {
          await loadChapter(initialChapter);
        } else {
          await requestAnimationFrame(() => {
            openDedicationPage();
          });
        }
      }

      init();
    })();
  </script>
</body>
</html>
